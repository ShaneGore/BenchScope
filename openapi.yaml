openapi: 3.1.0
info:
  title: BenchScope API
  version: 0.1.0
  description: Personal-data endpoints require a Clerk JWT bearer token. The backend verifies the token through JWKS and derives ownership only from its verified subject. Initial contract derived from the frontend service interface; FastAPI-generated OpenAPI remains authoritative after reconciliation.
servers:
  - url: /api/v1
    description: API v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              additionalProperties:
                type: string
    RunStatus:
      type: string
      enum: [running, completed, failed, interrupted]
    ErrorCategory:
      type: string
      enum: [OOM, TIMEOUT, MODEL_ERROR, INFER_FRAMEWORK, CANCELLED, HOST_RESTART, UNKNOWN]
    HardwareSnapshot:
      type: object
      additionalProperties: false
      properties:
        gpu: { type: [string, "null"] }
        gpu_vram_gb: { type: [number, "null"] }
        cpu: { type: [string, "null"] }
        ram_gb: { type: [number, "null"] }
        os: { type: [string, "null"] }
    RunEvent:
      type: object
      required: [ts, event]
      properties:
        ts: { type: string, format: date-time }
        event: { type: string }
        detail: { type: [string, "null"] }
    RunMetrics:
      type: object
      additionalProperties: false
      properties:
        quality_score: { type: [number, "null"], minimum: 0 }
        pass_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        ttft_ms: { type: [number, "null"], minimum: 0 }
        prompt_tokens: { type: [integer, "null"], minimum: 0 }
        output_tokens: { type: [integer, "null"], minimum: 0 }
        prompt_throughput_tps: { type: [number, "null"], minimum: 0 }
        generation_throughput_tps: { type: [number, "null"], minimum: 0 }
        elapsed_ms: { type: [integer, "null"], minimum: 0 }
    ImportedProfileSnapshot:
      type: object
      additionalProperties: false
      required: [name, model_name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        model_name: { type: string, minLength: 1, maxLength: 255 }
        model_version: { type: [string, "null"], maxLength: 255 }
        quantisation: { type: [string, "null"], maxLength: 100 }
    ImportedBenchmarkConfig:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        temperature: { type: number, minimum: 0 }
        max_tokens: { type: integer, minimum: 1 }
        reasoning: { type: boolean }
        mtp: { type: boolean }
        ctx: { type: integer, minimum: 1 }
        seed: { type: integer, minimum: 0 }
    ImportedMetrics:
      type: object
      additionalProperties: false
      properties:
        quality_score: { type: [number, "null"], minimum: 0 }
        pass_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        ttft_ms: { type: [number, "null"], minimum: 0 }
        prompt_tokens: { type: [integer, "null"], minimum: 0 }
        output_tokens: { type: [integer, "null"], minimum: 0 }
        prompt_throughput_tps: { type: [number, "null"], minimum: 0 }
        generation_throughput_tps: { type: [number, "null"], minimum: 0 }
        elapsed_ms: { type: [integer, "null"], minimum: 0 }
    ImportedHardwareSnapshot:
      type: object
      additionalProperties: false
      properties:
        cpu: { type: [string, "null"] }
        gpu: { type: [string, "null"] }
        ram_gb: { type: [number, "null"], minimum: 0 }
        gpu_vram_gb: { type: [number, "null"], minimum: 0 }
        os: { type: [string, "null"] }
    RunImportRequest:
      type: object
      additionalProperties: false
      required: [format_version, profile_snapshot, benchmark_config, started_at, ended_at]
      properties:
        format_version: { const: benchscope.run.v1 }
        source_run_id: { type: [string, "null"], minLength: 1, maxLength: 255 }
        profile_snapshot: { $ref: "#/components/schemas/ImportedProfileSnapshot" }
        benchmark_config: { $ref: "#/components/schemas/ImportedBenchmarkConfig" }
        started_at: { type: string, format: date-time, description: Must include a timezone offset. }
        ended_at: { type: string, format: date-time, description: Must include a timezone offset and be at or after started_at. }
        metrics: { $ref: "#/components/schemas/ImportedMetrics" }
        hardware_snapshot:
          anyOf:
            - $ref: "#/components/schemas/ImportedHardwareSnapshot"
            - type: "null"
    ProfileSnapshot:
      type: object
      required: [name, model_name]
      properties:
        profile_id: { type: [string, "null"] }
        name: { type: string }
        model_name: { type: string }
        model_version: { type: [string, "null"] }
        quantisation: { type: [string, "null"] }
        quantization: { type: [string, "null"] }
        context_length: { type: [number, "null"] }
        inference_engine: { type: [string, "null"] }
    BenchmarkConfig:
      type: object
      required: [name]
      properties:
        name: { type: string }
        temperature: { type: [number, "null"], minimum: 0 }
        max_tokens: { type: integer }
        reasoning: { type: [boolean, "null"] }
        mtp: { type: [boolean, "null"] }
        ctx: { type: [integer, "null"], minimum: 1 }
        seed: { type: [integer, "null"], minimum: 0 }
        concurrency: { type: integer }
        prompt_set: { type: string }
    ModelProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - owner_id
        - name
        - model_name
        - model_version
        - quantisation
        - endpoint_url
        - hardware_notes
        - inference_config
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string }
        name: { type: string }
        model_name: { type: string }
        model_version: { type: [string, "null"] }
        quantisation: { type: [string, "null"] }
        endpoint_url: { type: [string, "null"], description: Local mode only; treated as data and must not contain credentials. }
        hardware_notes: { type: [string, "null"] }
        inference_config:
          type: [object, "null"]
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProfileCreate:
      type: object
      additionalProperties: false
      required: [name, model_name]
      properties:
        name: { type: string, maxLength: 255 }
        model_name: { type: string, maxLength: 255 }
        model_version: { type: [string, "null"], maxLength: 255 }
        quantisation: { type: [string, "null"], maxLength: 100 }
        endpoint_url: { type: [string, "null"], description: Local mode only; treated as data and must not contain credentials. }
        hardware_notes: { type: [string, "null"] }
        inference_config:
          type: [object, "null"]
          additionalProperties: true
    ProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, maxLength: 255 }
        model_name: { type: string, maxLength: 255 }
        model_version: { type: [string, "null"], maxLength: 255 }
        quantisation: { type: [string, "null"], maxLength: 100 }
        endpoint_url: { type: [string, "null"], description: Local mode only; treated as data and must not contain credentials. }
        hardware_notes: { type: [string, "null"] }
        inference_config:
          type: [object, "null"]
          additionalProperties: true
    BenchmarkRun:
      type: object
      required: [id, owner_id, status, profile_snapshot, benchmark_config, started_at, metrics]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string }
        status: { $ref: "#/components/schemas/RunStatus" }
        profile_snapshot: { $ref: "#/components/schemas/ProfileSnapshot" }
        benchmark_config: { $ref: "#/components/schemas/BenchmarkConfig" }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        related_run_id: { type: [string, "null"] }
        source: { type: [string, "null"], enum: [imported, launched, retry, null] }
        fingerprint: { type: [string, "null"] }
        artifact_ref: { type: [string, "null"] }
        events: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }
        metrics: { $ref: "#/components/schemas/RunMetrics" }
        error_category: { $ref: "#/components/schemas/ErrorCategory", nullable: true }
        error_message_sanitised: { type: [string, "null"] }
        process_exit_code: { type: [integer, "null"] }
        hardware_snapshot: { $ref: "#/components/schemas/HardwareSnapshot", nullable: true }
    PaginatedRuns:
      type: object
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BenchmarkRun" } }
        next_cursor: { type: [string, "null"], format: uuid, description: UUID of the last returned run when has_more is true. }
        has_more: { type: boolean }
    ImportResult:
      type: object
      oneOf:
        - type: object
          required: [ok, run]
          properties:
            ok: { const: true }
            run: { $ref: "#/components/schemas/BenchmarkRun" }
        - type: object
          required: [ok, status, errors]
          properties:
            ok: { const: false }
            status: { type: integer }
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
    BenchmarkStartRequest:
      type: object
      required: [profile_id, config]
      properties:
        profile_id: { type: string }
        config: { $ref: "#/components/schemas/BenchmarkConfig" }
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /ready:
    get:
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready
  /api/v1/profiles:
    get:
      summary: List own profiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelProfile" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      summary: Create profile
      description: Hosted mode rejects endpoint_url, credentials, and non-null inference_config.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProfile" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get profile
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProfile" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Invalid profile id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    patch:
      summary: Update profile
      description: Hosted mode rejects endpoint_url, credentials, and non-null inference_config.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProfile" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    delete:
      summary: Delete profile
      responses:
        "204": { description: Deleted }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404": { description: Not found }
        "422":
          description: Invalid profile id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/runs:
    get:
      summary: List own runs
      description: >-
        Always scopes results to the authenticated owner. Model matches profile_snapshot.model_name
        exactly. Date-time filters must include a timezone and are normalized to UTC;
        from is inclusive and to is exclusive. from must precede to. Results are ordered
        by started_at DESC, then id DESC. A cursor must identify a run in the current
        owner and filter scope. Limit defaults to 50 and must be 1 through 100.
      parameters:
        - name: status
          in: query
          description: Exact run status.
          schema: { $ref: "#/components/schemas/RunStatus" }
        - name: model
          in: query
          description: Exact profile_snapshot.model_name.
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive timezone-aware instant.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive timezone-aware instant.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: UUID of the last returned run in the same owner/filter scope.
          schema: { type: string, format: uuid }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRuns" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Invalid filter, range, or cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get run
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkRun" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Not found or not owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    delete:
      summary: Delete run
      responses:
        "204": { description: Deleted }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: Not found or not owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/runs/import:
    post:
      summary: Import result JSON
      description: >-
        Imports one normalized, completed run summary. A trusted exporter must
        create benchscope.run.v1; private per-trial JSONL is not accepted and
        the raw request bytes are not retained. Uploads are limited by
        MAX_UPLOAD_BYTES (default 1 MiB).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunImportRequest" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: Duplicate import for this owner; no row was created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "413":
          description: Upload exceeds MAX_UPLOAD_BYTES; the request body was not buffered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "422":
          description: Invalid JSON, unsupported or incomplete version, invalid values, or non-JSON content type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
  /runs/{id}/retry:
    post:
      summary: Retry failed run (local mode only)
      x-local-only: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkRun" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { description: Not available in this mode }
        "404": { description: Not found }
        "409": { description: A benchmark run is already active }
  /api/v1/runs/compare:
    get:
      summary: Compare completed runs
      description: >-
        Requires at least two distinct UUIDs. If any ID is missing or not owned by
        the authenticated owner, rejects the entire batch with the same generic 404. Returns
        completed runs only, in input order; if fewer than two remain, returns 422.
        Metric values are passed through, including null values.
      parameters:
        - name: ids
          in: query
          required: true
          description: At least two distinct run UUIDs, comma-delimited in input order.
          schema:
            type: array
            items: { type: string, format: uuid }
            minItems: 2
            uniqueItems: true
          style: form
          explode: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BenchmarkRun" }
        "401":
          description: Missing or invalid authentication token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: At least one ID is missing or not owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Invalid IDs or fewer than two completed runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /benchmark/runs:
    post:
      summary: Start benchmark run (local mode only)
      x-local-only: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BenchmarkStartRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkRun" }
        "401": { description: Unauthorized }
        "404": { description: Not available in this mode }
        "409": { description: A benchmark run is already active }
  /benchmark/runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Benchmark run status and events (local mode only)
      x-local-only: true
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkRun" }
        "401": { description: Unauthorized }
        "404": { description: Not found or not available }
  /benchmark/runs/{id}/cancel:
    post:
      summary: Cancel benchmark run (local mode only)
      x-local-only: true
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkRun" }
        "401": { description: Unauthorized }
        "404": { description: Not found or not available }
        "409": { description: Run is not running }
  /demo/runs:
    get:
      summary: Synthetic demo runs
      security: []
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRuns" }
  /demo/runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Synthetic demo run
      security: []
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BenchmarkRun" }
        "404": { description: Not found }
