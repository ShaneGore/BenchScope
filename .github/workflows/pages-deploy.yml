name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate public frontend configuration
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Repository variable VITE_API_URL is required."
            exit 1
          fi
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository variable VITE_CLERK_PUBLISHABLE_KEY is required."
            exit 1
          fi
          node -e '
            const { isIP } = require("node:net");
            let url;
            try { url = new URL(process.env.VITE_API_URL); } catch {}
            const host = url?.hostname.toLowerCase().replace(/^\[|\]$/g, "");
            const ipv4 = host && isIP(host) === 4 ? host.split(".").map(Number) : null;
            const privateV4 = ipv4 && (
              ipv4[0] === 0 || ipv4[0] === 10 || ipv4[0] === 127 ||
              (ipv4[0] === 172 && ipv4[1] >= 16 && ipv4[1] <= 31) ||
              (ipv4[0] === 192 && ipv4[1] === 168) ||
              (ipv4[0] === 169 && ipv4[1] === 254) ||
              (ipv4[0] === 100 && ipv4[1] >= 64 && ipv4[1] <= 127) ||
              ipv4[0] >= 224
            );
            const privateV6 = host && isIP(host) === 6 && (
              host === "::" || host === "::1" || /^(fc|fd|fe[89ab])/i.test(host)
            );
            const localName = !host || host === "localhost" ||
              /\.(localhost|local|internal|test|invalid|example)$/.test(host);
            if (!url || url.protocol !== "https:" || !url.hostname ||
                url.username || url.password || localName || privateV4 || privateV6) {
              console.error("VITE_API_URL must be a public HTTPS URL.");
              process.exit(1);
            }
          '

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build and verify static frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_MODE: hosted
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          pnpm build
          if node scripts/check-static-build.mjs dist >/dev/null 2>&1; then
            echo "Static frontend build verified."
          else
            echo "::error::Static frontend validation failed; artifact was not uploaded."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
