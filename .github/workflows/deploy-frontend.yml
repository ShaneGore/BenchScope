name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Use 'main' or a full 40-character commit SHA from main history.
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Determine deployment ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ -z "${WORKFLOW_SHA:-}" ]; then
              echo "::error::Successful CI run did not provide a commit SHA."
              exit 1
            fi
            selected_ref="$WORKFLOW_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            requested_ref="${INPUT_REF:-main}"
            requested_ref="$(printf '%s' "$requested_ref" | tr '[:upper:]' '[:lower:]')"
            if [ "$requested_ref" = "main" ]; then
              selected_ref="main"
            else
              if ! printf '%s\n' "$requested_ref" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "::error::Requested ref must be 'main' or a full 40-character commit SHA."
                exit 1
              fi
              compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${requested_ref}...main" --jq '.status')" || {
                echo "::error::Requested commit is not available in ${GITHUB_REPOSITORY}."
                exit 1
              }
              case "$compare_status" in
                ahead|identical)
                  selected_ref="$requested_ref"
                  ;;
                *)
                  echo "::error::Requested commit is not an ancestor of main (compare status: ${compare_status})."
                  exit 1
                  ;;
              esac
            fi
          else
            echo "::error::Unsupported deployment event: ${EVENT_NAME}."
            exit 1
          fi
          echo "selected_ref=$selected_ref" >> "$GITHUB_OUTPUT"

      - name: Check frontend deployment configuration
        id: config
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_API_URL" ] || [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Frontend deployment skipped because VITE_API_URL or VITE_CLERK_PUBLISHABLE_KEY is not configured."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
        with:
          ref: ${{ steps.ref.outputs.selected_ref }}
          persist-credentials: false

      - name: Validate public frontend configuration
        if: steps.config.outputs.configured == 'true'
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          node -e '
            const { isIP } = require("node:net");
            let url;
            try { url = new URL(process.env.VITE_API_URL); } catch {}
            const host = url?.hostname.toLowerCase().replace(/^\[|\]$/g, "");
            const ipv4 = host && isIP(host) === 4 ? host.split(".").map(Number) : null;
            const privateV4 = ipv4 && (
              ipv4[0] === 0 || ipv4[0] === 10 || ipv4[0] === 127 ||
              (ipv4[0] === 172 && ipv4[1] >= 16 && ipv4[1] <= 31) ||
              (ipv4[0] === 192 && ipv4[1] === 168) ||
              (ipv4[0] === 169 && ipv4[1] === 254) ||
              (ipv4[0] === 100 && ipv4[1] >= 64 && ipv4[1] <= 127) ||
              ipv4[0] >= 224
            );
            const privateV6 = host && isIP(host) === 6 && (
              host === "::" || host === "::1" || /^(fc|fd|fe[89ab])/i.test(host)
            );
            const localName = !host || host === "localhost" ||
              /\.(localhost|local|internal|test|invalid|example)$/.test(host);
            if (!url || url.protocol !== "https:" || !url.hostname ||
                url.username || url.password || localName || privateV4 || privateV6) {
              console.error("VITE_API_URL must be a public HTTPS URL.");
              process.exit(1);
            }
          '

      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.configured == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build and verify static frontend
        if: steps.config.outputs.configured == 'true'
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_MODE: hosted
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          pnpm build
          node scripts/check-static-build.mjs dist

      - uses: actions/upload-pages-artifact@v3
        if: steps.config.outputs.configured == 'true'
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        if: steps.config.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
