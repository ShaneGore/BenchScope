name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Use main, a versioned release tag, or an exact commit SHA.
        required: false
        default: main

permissions:
  contents: read

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Determine deployment ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            selected_ref="$WORKFLOW_SHA"
          else
            selected_ref="${INPUT_REF:-main}"
          fi
          if ! printf '%s' "$selected_ref" | grep -Eq '^(main|refs/heads/main|[0-9a-f]{40}|(refs/tags/)?v[0-9][A-Za-z0-9._-]*)$'; then
            echo "::error::Select main, a versioned release tag, or an exact commit SHA."
            exit 1
          fi
          echo "selected_ref=$selected_ref" >> "$GITHUB_OUTPUT"

      - name: Check backend deployment configuration
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SMOKE_TEST_USER_A_ID: ${{ vars.SMOKE_TEST_USER_A_ID }}
          SMOKE_TEST_USER_B_ID: ${{ vars.SMOKE_TEST_USER_B_ID }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_FRONTEND_URL: ${{ vars.SMOKE_FRONTEND_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RENDER_DEPLOY_HOOK_URL" ] || [ -z "$CLERK_SECRET_KEY" ] || [ -z "$SMOKE_TEST_USER_A_ID" ] || [ -z "$SMOKE_TEST_USER_B_ID" ] || [ -z "$SMOKE_API_URL" ] || [ -z "$SMOKE_FRONTEND_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend deployment skipped because DATABASE_URL, RENDER_DEPLOY_HOOK_URL, CLERK_SECRET_KEY, SMOKE_TEST_USER_A_ID, SMOKE_TEST_USER_B_ID, SMOKE_API_URL, or SMOKE_FRONTEND_URL is not configured."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'
        with:
          ref: ${{ steps.ref.outputs.selected_ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve exact deployment revision
        if: steps.config.outputs.configured == 'true'
        id: revision
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Deployment revision must be an ancestor of main."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.config.outputs.configured == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        if: steps.config.outputs.configured == 'true'

      - name: Run database migrations
        if: steps.config.outputs.configured == 'true'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv sync --locked --group dev
          uv run alembic upgrade head

      - name: Trigger backend deployment
        if: steps.config.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SELECTED_REF: ${{ steps.revision.outputs.sha }}
        run: |
          python scripts/render_deploy_hook.py

      - name: Wait for the intended backend revision
        if: steps.config.outputs.configured == 'true'
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          EXPECTED_REVISION: ${{ steps.revision.outputs.sha }}
        run: python scripts/wait_for_deployment.py

      - name: Generate smoke credentials
        if: steps.config.outputs.configured == 'true'
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          SMOKE_TEST_USER_A_ID: ${{ vars.SMOKE_TEST_USER_A_ID }}
          SMOKE_TEST_USER_B_ID: ${{ vars.SMOKE_TEST_USER_B_ID }}
        run: |
          python scripts/generate_smoke_tokens.py --write-github-env --expires-in 60

      - name: Run post-deployment smoke tests
        if: steps.config.outputs.configured == 'true'
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_FRONTEND_URL: ${{ vars.SMOKE_FRONTEND_URL }}
        run: |
          python scripts/smoke_test.py --mode full
