apiVersion: 1

groups:
  - orgId: 1
    name: benchscope-api-availability
    folder: Observability
    interval: 30s
    rules:
      - uid: benchscope-api-unavailable
        title: BenchScopeApiUnavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'up{job="api"}'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: BenchScope API scrape is unavailable
          description: >-
            Inspect /ready and the API/database logs. Restart the API only after
            confirming the database and configuration.
        labels:
          severity: warning
        notification_settings:
          receiver: benchscope-alert-receiver
          group_wait: 0s
          group_interval: 30s
          repeat_interval: 4h
        isPaused: false
