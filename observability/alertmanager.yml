global:
  resolve_timeout: 5m

route:
  receiver: discard-unmatched
  group_by: [alertname, instance]
  routes:
    - receiver: benchscope-alert-intake
      matchers:
        - alertname="BenchScopeApiUnavailable"

receivers:
  - name: discard-unmatched
  - name: benchscope-alert-intake
    webhook_configs:
      - url: http://alert-receiver:8001/alertmanager/v4
        send_resolved: true
        http_config:
          bearer_token_file: /run/secrets/alert-receiver-bearer
