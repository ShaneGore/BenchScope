[project]
name = "benchscope-backend"
version = "0.1.0"
description = "BenchScope FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-exporter-prometheus>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3.5",
    "ruff>=0.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
